plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    // Dev-only end-to-end test mod; never packaged into the release jar.
    autotest {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
    }
}

loom {
    mods {
        "spiderman" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "spiderman_autotest" {
            sourceSet sourceSets.autotest
        }
    }

    runs {
        // Headless end-to-end test: xvfb-run -a -s "-screen 0 960x540x24" ./gradlew runAutotest
        autotest {
            client()
            name = "Autotest Client"
            source sourceSets.autotest
            runDir = "run-autotest"
            vmArg "-Dspiderman.autotest=true"
            programArgs "--width", "960", "--height", "540"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
